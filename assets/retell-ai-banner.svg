<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Retell AI Customer Support Voice Agent</title>
<desc id="desc">Animated futuristic banner for a Retell AI voice agent assessment project.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#070b18"/><stop offset=".5" stop-color="#101b3d"/><stop offset="1" stop-color="#111827"/>
  </linearGradient>
  <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#60a5fa"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#22d3ee"/>
  </linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="4"/></filter>
  <clipPath id="clip"><rect x="28" y="28" width="1144" height="304" rx="30"/></clipPath>
</defs>
<rect width="1200" height="360" fill="#050814"/>
<g clip-path="url(#clip)">
  <rect x="28" y="28" width="1144" height="304" rx="30" fill="url(#bg)" stroke="#334155" stroke-width="2"/>
  <ellipse cx="190" cy="70" rx="180" ry="80" fill="#2563eb" opacity=".22" filter="url(#blur)">
    <animate attributeName="cx" values="190;360;190" dur="7s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="1020" cy="290" rx="190" ry="90" fill="#7c3aed" opacity=".18" filter="url(#blur)">
    <animate attributeName="cx" values="1020;850;1020" dur="8s" repeatCount="indefinite"/>
  </ellipse>
  <path d="M-50 290 C260 120 410 410 720 190 S1040 100 1250 230" fill="none" stroke="url(#glow)" stroke-width="2" opacity=".55">
    <animate attributeName="d" dur="6s" repeatCount="indefinite" values="M-50 290 C260 120 410 410 720 190 S1040 100 1250 230;M-50 250 C280 360 430 70 720 210 S1050 330 1250 140;M-50 290 C260 120 410 410 720 190 S1040 100 1250 230"/>
  </path>
  <g fill="#93c5fd">
    <circle cx="900" cy="95" r="3"><animate attributeName="r" values="2;5;2" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="1010" cy="145" r="3"><animate attributeName="r" values="3;6;3" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="1080" cy="100" r="2"><animate attributeName="r" values="2;5;2" dur="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="930" cy="250" r="3"><animate attributeName="r" values="3;6;3" dur="2.5s" repeatCount="indefinite"/></circle>
  </g>
  <g transform="translate(82 82)">
    <rect width="116" height="34" rx="17" fill="#1d4ed8" opacity=".9"/>
    <text x="58" y="23" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="2">RETELL AI</text>
  </g>
  <text x="82" y="175" fill="#fff" font-family="Arial,sans-serif" font-size="42" font-weight="800">AI Customer Support</text>
  <text x="82" y="222" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="25">Voice Agent • GPT 5.6 Terra • Cimo • End Call</text>
  <g transform="translate(82 254)">
    <rect width="235" height="42" rx="21" fill="#0f172a" stroke="#60a5fa"/>
    <circle cx="22" cy="21" r="6" fill="#22c55e"><animate attributeName="opacity" values="1;.25;1" dur="1.2s" repeatCount="indefinite"/></circle>
    <text x="40" y="27" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="16" font-weight="700">TOPIC 1 • DEMO READY</text>
  </g>
</g>
</svg>